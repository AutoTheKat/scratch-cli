name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LordCat0/scratch-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(process.env.GITHUB_REF_NAME, /^v\d+\.\d+\.\d+$/, 'Use a stable version tag, such as v0.1.0');
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match package.json version');
          NODE
      - run: npm ci
      - run: npm test
      - name: Pack release
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          echo "tarball=$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
